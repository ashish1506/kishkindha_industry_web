name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Deploy to DigitalOcean
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.KISHKINDHA_FOODS_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.KISHKINDHA_FOODS_DEPLOY_SSH_KEY }}
          source: "out/*"
          target: "/var/www/kishkindhafoods"
          strip_components: 1
          overwrite: true
